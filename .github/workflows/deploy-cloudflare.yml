# Builds the site and publishes it to Cloudflare Pages on every push to main
# (including saves from the web editor). Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until the Cloudflare secrets are set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set yet; nothing to deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@3 pages deploy dist --project-name=revue-juristes-sciences-po --branch=main --commit-dirty=true
